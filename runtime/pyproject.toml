[project]
name = "mutable_file_runtime"
version = "0.1.0"
description = "Runtime for assembling and reconciling layered mutable files"
requires-python = ">=3.12"
dependencies = [
    "tomlkit>=0.14.0",
]

[project.scripts]
mutable-file-runtime = "mutable_file_runtime.main:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
